name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
      build_release: ${{ steps.release.outputs.build_release }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      upstream_url: ${{ steps.release.outputs.upstream_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test sync safeguards
        run: node --test .github/scripts/sync-upstream.test.mjs infra/sync-webhook/server.test.mjs
      - id: sync
        name: Rebase onto upstream main
        continue-on-error: true
        run: |
          base_ref="$(git rev-parse HEAD)"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          cp .github/scripts/recover-upstream-with-pi.sh "$RUNNER_TEMP/recover-upstream-with-pi.sh"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main
          bash .github/scripts/rebase-upstream.sh upstream/main

      - id: recover
        name: Resolve source conflicts with Pi
        if: steps.sync.outcome == 'failure'
        timeout-minutes: 40
        env:
          SYNC_WEBHOOK_URL: ${{ secrets.SYNC_WEBHOOK_URL }}
          SYNC_WEBHOOK_SECRET: ${{ secrets.SYNC_WEBHOOK_SECRET }}
        run: bash "$RUNNER_TEMP/recover-upstream-with-pi.sh"

      - id: finalize
        name: Preserve fork workflow and detect dependency changes
        run: |
          base_ref="${{ steps.sync.outputs.base_ref }}"
          if ! git diff --quiet "$base_ref" -- .github/workflows; then
            git restore --source="$base_ref" --staged --worktree .github/workflows
            git commit --amend --no-edit
          fi
          if git diff --quiet "$base_ref" -- package.json ':(glob)**/package.json' pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "pnpm_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pnpm_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Vite+
        if: steps.finalize.outputs.pnpm_changed == 'true' || steps.recover.outcome == 'success'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: false

      - name: Regenerate and verify pnpm lockfile
        if: steps.finalize.outputs.pnpm_changed == 'true'
        run: |
          vp install --lockfile-only --no-frozen-lockfile --ignore-scripts
          vp install --lockfile-only --frozen-lockfile --ignore-scripts

      - name: Install Nix
        if: steps.finalize.outputs.pnpm_changed == 'true'
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Refresh dependency hashes and verify Nix builds
        if: steps.finalize.outputs.pnpm_changed == 'true'
        run: |
          node .github/scripts/update-nix-hashes.mjs
          nix build .#desktop .#server --no-link --show-trace
          git add pnpm-lock.yaml flake.nix
          if ! git diff --cached --quiet; then
            git commit -m "fix(build): refresh generated dependencies after upstream sync"
          fi

      - name: Validate Pi recovery before publishing
        if: steps.recover.outcome == 'success'
        run: |
          vp install --frozen-lockfile
          vp run --filter @t3tools/contracts typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/web typecheck
          vp run --filter @t3tools/contracts test
          vp run --filter t3 test
          vp run --filter @t3tools/web test
          vp run --filter @t3tools/web build
          test -z "$(git status --porcelain)"

      - id: publish
        name: Push synced main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch upstream main
          git merge-base --is-ancestor upstream/main HEAD
          git -c core.hooksPath=/dev/null -c credential.helper= \
            -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' \
            push --force-with-lease=refs/heads/main:${{ steps.sync.outputs.base_ref }} origin HEAD:main
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: release
        name: Find latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/pingdotgg/t3code/releases?per_page=10' > upstream-releases.json
          gh api 'repos/${{ github.repository }}/releases?per_page=100' > fork-releases.json
          upstream_tag="$(jq -r 'map(select(.draft | not))[0].tag_name // empty' upstream-releases.json)"
          upstream_url="$(jq -r 'map(select(.draft | not))[0].html_url // empty' upstream-releases.json)"
          mirrored="$(jq -r --arg tag "$upstream_tag" --arg url "$upstream_url" '
            any(
              .name == ("T3 Code fork build based on " + $tag)
              or .body == ("Based on upstream release: " + $url)
            )
          ' fork-releases.json)"
          if [[ -n "$upstream_tag" && "$mirrored" != true ]]; then
            build_release=true
          else
            build_release=false
          fi
          echo "build_release=$build_release" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$upstream_url" >> "$GITHUB_OUTPUT"

  desktop_release:
    needs: sync
    if: ${{ needs.sync.result == 'success' && needs.sync.outputs.build_release == 'true' }}
    uses: ./.github/workflows/desktop-build.yml
    with:
      ref: ${{ needs.sync.outputs.ref }}
      target: all
      publish: true
      upstream_tag: ${{ needs.sync.outputs.upstream_tag }}
      upstream_url: ${{ needs.sync.outputs.upstream_url }}
